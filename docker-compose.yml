version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
    depends_on:
      - api
    networks:
      - map-studio

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/local.db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
    volumes:
      - db-data:/data
    networks:
      - map-studio

networks:
  map-studio:
    driver: bridge

volumes:
  db-data: